<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SimplyByte - V2</title>
<style>
body{font-family:Arial;background:#e8f5e9;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;padding:40px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);border-top:12px solid #2ecc71;max-width:520px}
.badge{background:#2ecc71;color:white;padding:8px 20px;border-radius:20px;font-weight:bold;font-size:22px}
h1{color:#27ae60;font-size:42px;margin:15px 0 5px}
p{font-size:19px;color:#333}
.small{color:#777;font-size:14px}
button{background:#2ecc71;color:white;border:0;padding:12px 22px;border-radius:10px;font-size:16px;cursor:pointer}
#result{margin-top:15px;font-weight:bold;color:#27ae60;white-space:pre-wrap;text-align:left;background:#f0fff4;padding:12px;border-radius:10px}
</style></head>
<body><div class="card">
<div class="badge">✅ VERSION 2 - GREEN</div>
<h1>SimplyByte Backend</h1>
<p><b>Version 2 - Updated! Automation Success</b><br>Jenkins Deploy Worked! - Text + Color Maariduchu!</p>
<p class="small">Java 17 | Port Inside: 8090 | Port Outside: 8097</p>
<button onclick="check()">Check /api/health 👆</button>
<div id="result">Button ah Click pannu - Backend la irunthu V2 Text varum!</div>
</div>
<script>
async function check(){
  const r = await fetch('/api/health'); const j = await r.json();
  document.getElementById('result').innerText = "Backend Sonna Text:\nVersion: "+j.version+"\nMessage: "+j.message+"\nColor: "+j.color;
}
</script></body></html>
